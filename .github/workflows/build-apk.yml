name: Build Android APK

# Builds the NG Marshal field-app APK in the cloud (no local Android toolchain needed).
# The app is a native shell around the LIVE web console (server.url in capacitor.config.ts),
# so this APK reflects whatever is deployed to Vercel — every deploy shows up without a rebuild.
#
# Run it: Actions tab → "Build Android APK" → Run workflow. Also runs automatically when the
# app config or source changes on main. The finished APK is attached as a build artifact and,
# on manual runs, published to a GitHub Release for a stable download link.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "src/**"
      - "package.json"
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write # needed to publish the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Static export (web assets for the shell)
        # API route handlers can't be statically exported; move them aside for the export.
        # At runtime the app loads the live site (server.url), so this bundle is just the
        # fallback shell Capacitor requires.
        run: |
          mv src/app/api /tmp/api-routes
          rm -rf .next out
          NEXT_OUTPUT=export npx next build
          mv /tmp/api-routes src/app/api

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage APK
        id: stage
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUT="NG-Marshal-v${VERSION}-connected.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ng-marshal-apk
          path: ${{ steps.stage.outputs.apk }}
          if-no-files-found: error

      - name: Publish Release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.stage.outputs.version }}-${{ github.run_number }}
          name: NG Marshal APK v${{ steps.stage.outputs.version }} (build ${{ github.run_number }})
          body: |
            Connected field-app APK — loads the live web console (server.url).
            Any Vercel deploy reflects in this app without a rebuild.
          files: ${{ steps.stage.outputs.apk }}
